<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashflow</title>
  <meta name="description" content="Interactive cashflow Sankey: add inflows and outflows and watch the money move." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e9ecf4;
      --line-strong: #dde2ee;
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --soft: #94a3b8;
      --track: #edf0f6;
      --in: #16a34a;
      --in-2: #16a34a;
      --out: #dc2626;
      --out-2: #dc2626;
      --pool: #475569;
      --warn: #f59e0b;
      --ok: #22c55e;
      --radius: 22px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .num { font-variant-numeric: tabular-nums; }
    button, input, select { font: inherit; color: inherit; }

    .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* Header */
    header {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap;
      padding: 12px 24px; max-width: 1680px; width: 100%; margin: 0 auto;
    }
    .actions { display: flex; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
      background: #fff; border: 1px solid var(--line-strong); color: var(--ink-2);
      transition: transform .2s var(--ease), border-color .2s, background .2s;
    }
    .btn:hover { transform: translateY(-1px); border-color: #cbd3e3; }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn svg { width: 16px; height: 16px; }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover { background: #1e293b; }

    /* 3-panel grid */
    main {
      flex: 1; width: 100%; max-width: 1680px; margin: 0 auto;
      display: grid; gap: 18px; padding: 4px 24px 24px;
      grid-template-columns: minmax(290px, 350px) minmax(0, 1fr) minmax(300px, 370px);
    }
    @media (min-width: 1100px) {
      .app { height: 100vh; }
      main { min-height: 0; }
      .panel { min-height: 0; }
    }
    @media (max-width: 1099px) {
      main { grid-template-columns: 1fr 1fr; align-content: start; align-items: start; }
      .center { grid-column: 1 / -1; order: -1; }
      .list { max-height: 560px; }
    }
    @media (max-width: 700px) {
      header { padding: 12px 16px; }
      main { grid-template-columns: 1fr; padding: 4px 16px 16px; gap: 14px; }
      .btn span { display: none; }
    }

    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
      animation: panelIn .7s var(--ease) both;
    }
    .panel:nth-child(2) { animation-delay: .08s; }
    .panel:nth-child(3) { animation-delay: .16s; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }

    .panel-head { padding: 18px 18px 14px; position: relative; }
    .panel-head::after {
      content: ''; position: absolute; left: 18px; right: 18px; bottom: 0; height: 1px; background: var(--line);
    }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .head-title { display: flex; align-items: center; gap: 10px; }
    .head-icon {
      width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex-shrink: 0;
    }
    .head-icon svg { width: 18px; height: 18px; }
    .in-panel .head-icon { background: var(--in); }
    .out-panel .head-icon { background: var(--out); }
    .head-title h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .head-title small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
    .head-total { margin-top: 12px; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
    .in-panel .head-total { color: var(--in); }
    .out-panel .head-total { color: var(--out); }
    .chip-btn {
      font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer;
      background: #fff; border: 1px solid var(--line-strong); color: var(--muted);
      transition: all .2s var(--ease);
    }
    .chip-btn:hover { color: var(--ink); border-color: #cbd3e3; }

    /* Item lists */
    .list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb { background: #e2e6ef; border-radius: 99px; border: 2px solid #fff; }

    .item {
      --c: #6366f1;
      position: relative; flex-shrink: 0; border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 12px 16px;
      background: #fff; overflow: hidden;
      transition: border-color .25s, transform .25s var(--ease), opacity .3s, filter .3s;
    }
    .item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c);
      transition: width .25s var(--ease);
    }
    .item:hover, .item.linked {
      border-color: color-mix(in srgb, var(--c) 40%, var(--line));
      transform: translateY(-1px);
    }
    .item:hover::before, .item.linked::before { width: 6px; }
    .item.off { opacity: .55; filter: saturate(.3); }
    .item.off:hover { opacity: .8; }
    .item.enter { animation: itemIn .55s var(--ease) both; }
    @keyframes itemIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    .item.leaving { animation: itemOut .3s var(--ease) forwards; }
    @keyframes itemOut { to { opacity: 0; transform: translateX(24px) scale(.96); } }

    .item-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
    .item-name { flex: 1; min-width: 0; }
    .item-name .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-name .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11.5px; color: var(--soft); min-width: 0; }
    .item-name .meta span.note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tier {
      flex-shrink: 0; border: 0; cursor: pointer; font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
      padding: 2px 7px; border-radius: 999px; transition: all .2s;
    }
    .tier.must { background: #fee2e2; color: #b91c1c; }
    .tier.optional { background: #f1f5f9; color: #475569; }
    .tier:hover { filter: brightness(.96); transform: scale(1.04); }

    .del {
      width: 28px; height: 28px; border-radius: 9px; border: 0; background: transparent; color: var(--soft);
      display: grid; place-items: center; cursor: pointer; opacity: 0; transition: all .2s;
    }
    .item:hover .del { opacity: 1; }
    .del:hover { background: #fff1f2; color: var(--out); }
    .del svg { width: 15px; height: 15px; }
    @media (hover: none) { .del { opacity: 1; } }

    /* Toggle switch */
    .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch span {
      position: absolute; inset: 0; border-radius: 99px; background: #dfe3ec; transition: background .25s;
    }
    .switch span::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; transition: transform .3s var(--ease);
    }
    .switch input:checked + span { background: var(--c); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid color-mix(in srgb, var(--c) 50%, transparent); outline-offset: 2px; }

    .item-bottom { display: flex; align-items: center; gap: 10px; margin-top: 10px; position: relative; z-index: 1; }
    .slider {
      --p: 50%;
      -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 99px; outline: none; cursor: pointer;
      background: linear-gradient(90deg, var(--c) 0, var(--c) var(--p), var(--track) var(--p));
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff;
      border: 3px solid var(--c); transition: transform .15s var(--ease);
    }
    .slider::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%; background: #fff;
      border: 3px solid var(--c);
    }
    .slider:hover::-webkit-slider-thumb, .slider:active::-webkit-slider-thumb { transform: scale(1.25); }
    .amt {
      display: flex; align-items: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px;
      padding: 4px 8px; background: #fafbfd; transition: border-color .2s;
    }
    .amt:focus-within { border-color: var(--c); background: #fff; }
    .amt span { font-size: 12px; color: var(--soft); font-weight: 600; }
    .amt input {
      width: 74px; border: 0; outline: 0; background: transparent; text-align: right;
      font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
    }
    .amt input::-webkit-outer-spin-button, .amt input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* Add forms */
    .add-form { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; background: #fcfcfe; }
    .add-form input, .add-form select {
      border: 1px solid var(--line-strong); border-radius: 11px; padding: 9px 11px; font-size: 13px; outline: none;
      background: #fff; transition: border-color .2s; min-width: 0;
    }
    .add-form input[type=text] { flex: 1 1 120px; }
    .add-form input[type=number] { width: 104px; flex: 0 0 auto; }
    .in-panel .add-form input:focus { border-color: var(--in); }
    .out-panel .add-form input:focus, .out-panel .add-form select:focus { border-color: var(--out); }
    .add-btn {
      border: 0; border-radius: 11px; padding: 9px 14px; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
      transition: transform .2s var(--ease);
    }
    .in-panel .add-btn { background: var(--in); }
    .out-panel .add-btn { background: var(--out); }
    .add-btn:hover { transform: translateY(-1px); }
    .add-btn:active { transform: scale(.97); }

    /* Center panel */
    .center .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 16px 4px; }
    .kpi {
      border-radius: 16px; padding: 12px 14px; border: 1px solid var(--line); position: relative; overflow: hidden;
      transition: background .5s, border-color .5s;
    }
    .kpi label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; transition: color .5s; }
    .kpi .sub { font-size: 11.5px; color: var(--soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi.in { background: #fff; }
    .kpi.in .v { color: var(--in); }
    .kpi.out { background: #fff; }
    .kpi.out .v { color: var(--out); }
    .kpi.net.pos { background: #fff; }
    .kpi.net.pos .v { color: #16a34a; }
    .kpi.net.neg { background: #fff; }
    .kpi.net.neg .v { color: #d97706; }
    .kpi .bar { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 0 3px 3px 0; transition: width .7s var(--ease), background .5s; }
    .kpi.in .bar { background: var(--in); }
    .kpi.out .bar { background: var(--out); }
    .kpi.net.pos .bar { background: var(--ok); }
    .kpi.net.neg .bar { background: var(--warn); }
    @media (max-width: 520px) {
      .center .kpis { gap: 8px; padding: 12px 12px 4px; }
      .kpi { padding: 10px; }
      .kpi .v { font-size: 16px; }
      .kpi .sub { display: none; }
    }

    .sankey-wrap { flex: 1; position: relative; min-height: 440px; margin: 4px 8px 8px; }
    @media (max-width: 700px) { .sankey-wrap { min-height: 520px; margin: 0 4px 4px; } }
    #sankey { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; overflow: visible; }
    .s-link { cursor: pointer; transition: opacity .3s var(--ease); }
    .s-flow { pointer-events: none; animation: flow 1.4s linear infinite; transition: opacity .3s; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .s-node { cursor: pointer; transition: opacity .3s var(--ease); }
    .s-node rect { transition: filter .25s; }
    .s-node:hover rect { filter: brightness(1.08) drop-shadow(0 3px 6px rgba(15, 23, 42, .2)); }
    .s-dim { opacity: .14 !important; }
    .s-label { font-size: 12px; font-weight: 600; fill: var(--ink); }
    .s-value { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .s-pool-label { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .s-pool-value { font-size: 15px; font-weight: 800; fill: var(--ink); font-variant-numeric: tabular-nums; }
    .empty {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--soft);
      font-size: 14px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity .4s;
    }
    .empty.show { opacity: 1; }

    /* Tooltip */
    #tip {
      position: fixed; z-index: 60; pointer-events: none; min-width: 160px; max-width: 260px;
      background: #fff;
      border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 12px;
      opacity: 0; transform: translateY(4px) scale(.98); transition: opacity .15s, transform .15s var(--ease);
    }
    #tip.show { opacity: 1; transform: none; }
    #tip .t { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    #tip .t i { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    #tip .a { font-size: 17px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
    #tip .m { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 22px; z-index: 70; pointer-events: none;
      transform: translate(-50%, 16px); opacity: 0; transition: all .35s var(--ease);
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 16px; border-radius: 999px;
      display: flex; align-items: center; gap: 8px;
    }
    #toast.show { transform: translate(-50%, 0); opacity: 1; }
    #toast i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .s-flow { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="actions">
        <button id="resetBtn" class="btn" type="button" title="Restore the default items">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.6m14.8 2A8 8 0 004.6 9M4.6 9H9m11 11v-5h-.6m0 0a8 8 0 01-15.3-2m15.3 2H15" /></svg>
          <span>Reset</span>
        </button>
        <button id="copyBtn" class="btn primary" type="button" title="Copy scenario as JSON">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
          <span>Copy JSON</span>
        </button>
      </div>
    </header>

    <main>
      <!-- Left: Inflows -->
      <section class="panel in-panel" aria-label="Inflows">
        <div class="panel-head">
          <div class="head-row">
            <div class="head-title">
              <div class="head-icon"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v14m0 0l-6-6m6 6l6-6" /></svg></div>
              <div><h2>Inflows</h2><small id="inCount">0 sources</small></div>
            </div>
          </div>
          <div class="head-total num" id="inTotal">₹0</div>
        </div>
        <div class="list" id="inList"></div>
        <form class="add-form" id="inForm" autocomplete="off">
          <input type="text" id="inLabel" placeholder="New income source" required />
          <input type="number" id="inAmount" placeholder="₹ Amount" min="0" step="50" required />
          <button class="add-btn" type="submit">Add</button>
        </form>
      </section>

      <!-- Middle: Sankey -->
      <section class="panel center" aria-label="Cashflow diagram">
        <div class="kpis">
          <div class="kpi in"><label>Money in</label><div class="v num" id="kIn">₹0</div><div class="sub" id="kInSub">&nbsp;</div><div class="bar" id="kInBar"></div></div>
          <div class="kpi out"><label>Money out</label><div class="v num" id="kOut">₹0</div><div class="sub" id="kOutSub">&nbsp;</div><div class="bar" id="kOutBar"></div></div>
          <div class="kpi net pos" id="kNetCard"><label id="kNetLabel">Surplus</label><div class="v num" id="kNet">₹0</div><div class="sub" id="kNetSub">&nbsp;</div><div class="bar" id="kNetBar"></div></div>
        </div>
        <div class="sankey-wrap" id="sankeyWrap">
          <svg id="sankey" role="img" aria-label="Sankey diagram of inflows and outflows"></svg>
          <div class="empty" id="empty">Add an inflow or outflow to see the flow</div>
        </div>
      </section>

      <!-- Right: Outflows -->
      <section class="panel out-panel" aria-label="Outflows">
        <div class="panel-head">
          <div class="head-row">
            <div class="head-title">
              <div class="head-icon"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20V6m0 0l-6 6m6-6l6 6" /></svg></div>
              <div><h2>Outflows</h2><small id="outCount">0 items</small></div>
            </div>
            <button class="chip-btn" id="optBtn" type="button" title="Switch all optional items on or off">Optional on/off</button>
          </div>
          <div class="head-total num" id="outTotal">₹0</div>
        </div>
        <div class="list" id="outList"></div>
        <form class="add-form" id="outForm" autocomplete="off">
          <input type="text" id="outLabel" placeholder="New expense" required />
          <input type="number" id="outAmount" placeholder="₹ Amount" min="0" step="50" required />
          <select id="outTier" aria-label="Expense type">
            <option value="must">Must</option>
            <option value="optional">Optional</option>
          </select>
          <button class="add-btn" type="submit">Add</button>
        </form>
      </section>
    </main>
  </div>

  <div id="tip" role="tooltip"><div class="t"><i></i><span></span></div><div class="a"></div><div class="m"></div></div>
  <div id="toast" role="status"><i></i><span></span></div>

  <script>
    'use strict';

    const STORAGE_KEY = 'cashflow_sim_v2';
    const IN_COLORS = ['#16a34a', '#22c55e', '#15803d', '#4ade80', '#166534', '#65a30d'];
    const OUT_COLORS = ['#dc2626', '#ef4444', '#b91c1c', '#f87171', '#991b1b', '#e11d48'];
    const POOL_COLOR = '#6366f1';
    const SURPLUS_COLOR = '#16a34a';
    const SHORTFALL_COLOR = '#f59e0b';
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Data ---------- */
    function defaults() {
      const incomes = [
        { id: 'inc_salary', label: 'Salary', amount: 32000, max: 60000, enabled: true, note: 'Monthly salary' },
        { id: 'inc_mom', label: 'Mom Contribution', amount: 14000, max: 35000, enabled: true, note: 'Family support' },
        { id: 'inc_celerio', label: 'Celerio Rent', amount: 10100, max: 30000, enabled: true, note: '₹9,100 balance + ₹1,000 advance' }
      ];
      const expenses = [
        { id: 'exp_dad', label: 'Dad Amount', amount: 20000, max: 40000, enabled: true, tier: 'must' },
        { id: 'exp_cc', label: 'Credit Card (2209)', amount: 18260, max: 40000, enabled: true, tier: 'must', note: 'Due Dec 7' },
        { id: 'exp_edu_backlog', label: 'Edu Loan Backlog', amount: 10350, max: 30000, enabled: true, tier: 'must' },
        { id: 'exp_edu_dec10', label: 'Edu Loan (Dec 10)', amount: 8500, max: 25000, enabled: true, tier: 'must' },
        { id: 'exp_car_emi', label: 'Car EMI', amount: 12320, max: 25000, enabled: true, tier: 'must' },
        { id: 'exp_advance', label: 'Advance', amount: 10000, max: 25000, enabled: true, tier: 'must' },
        { id: 'exp_rent1', label: 'Rent 1', amount: 6000, max: 20000, enabled: true, tier: 'must' },
        { id: 'exp_app_emi', label: 'App EMI', amount: 2500, max: 15000, enabled: true, tier: 'must' },
        { id: 'exp_rent2', label: 'Rent 2', amount: 5000, max: 20000, enabled: false, tier: 'optional' },
        { id: 'exp_dress', label: 'Niranjana Dress', amount: 3000, max: 15000, enabled: false, tier: 'optional' },
        { id: 'exp_claude', label: 'Claude Code', amount: 2500, max: 10000, enabled: false, tier: 'optional' },
        { id: 'exp_chatgpt', label: 'ChatGPT', amount: 400, max: 5000, enabled: false, tier: 'optional' }
      ];
      return colorize({ incomes, expenses });
    }

    function colorize(s) {
      const fix = (list, palette) => list.forEach((it, i) => {
        if (!palette.includes(it.color)) it.color = palette[i % palette.length];
      });
      fix(s.incomes, IN_COLORS);
      fix(s.expenses, OUT_COLORS);
      return s;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (Array.isArray(p.incomes) && Array.isArray(p.expenses)) return colorize({ incomes: p.incomes, expenses: p.expenses });
        }
      } catch (_) { /* storage unavailable */ }
      return defaults();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) { /* ignore */ }
    }

    let state = loadState();

    function nextColor(list, palette) {
      const used = new Set(list.map((i) => i.color));
      return palette.find((c) => !used.has(c)) || palette[list.length % palette.length];
    }

    function computeTotals() {
      const amt = (i) => Math.max(0, Number(i.amount) || 0);
      const activeIncomes = state.incomes.filter((i) => i.enabled && amt(i) > 0);
      const activeExpenses = state.expenses.filter((e) => e.enabled && amt(e) > 0);
      const totalInflow = activeIncomes.reduce((s, i) => s + amt(i), 0);
      const totalExpense = activeExpenses.reduce((s, e) => s + amt(e), 0);
      const paused = state.expenses.filter((e) => !e.enabled);
      const net = totalInflow - totalExpense;
      return {
        activeIncomes, activeExpenses, totalInflow, totalExpense, net,
        pausedTotal: paused.reduce((s, e) => s + amt(e), 0), pausedCount: paused.length,
        surplus: Math.max(0, net), shortfall: Math.max(0, -net)
      };
    }

    /* ---------- Utils ---------- */
    const $ = (id) => document.getElementById(id);
    const fmt = (v) => { const n = Math.round(Number(v) || 0); return (n < 0 ? '-₹' : '₹') + Math.abs(n).toLocaleString('en-IN'); };
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const ease = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const lerp = (a, b, p) => a + (b - a) * p;
    const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
    const SVGNS = 'http://www.w3.org/2000/svg';
    function svgEl(tag, attrs, parent) {
      const el = document.createElementNS(SVGNS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(el);
      return el;
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.querySelector('span').textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Smoothly count a number from its previous value to the new one
    function countTo(el, to, dur = 600) {
      const from = el._v ?? 0;
      el._v = to;
      cancelAnimationFrame(el._raf);
      if (REDUCED || from === to) { el.textContent = fmt(to); return; }
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(lerp(from, to, ease(p)));
        if (p < 1) el._raf = requestAnimationFrame(step);
      };
      el._raf = requestAnimationFrame(step);
    }

    /* ---------- Lists ---------- */
    function cardHTML(item, type, cls) {
      const amount = Math.max(0, Number(item.amount) || 0);
      const max = Math.max(Number(item.max) || 50000, amount, 1000);
      const pct = Math.min(100, (amount / max) * 100);
      const tier = type === 'out'
        ? `<button type="button" class="tier ${item.tier === 'optional' ? 'optional' : 'must'}" data-role="tier" title="Click to switch">${item.tier === 'optional' ? 'Optional' : 'Must'}</button>`
        : '';
      const note = item.note ? `<span class="note">${esc(item.note)}</span>` : '';
      return `
        <div class="item ${item.enabled ? '' : 'off'} ${cls}" data-id="${esc(item.id)}" style="--c:${item.color}">
          <div class="item-top">
            <label class="switch" title="Include / exclude">
              <input type="checkbox" data-role="toggle" ${item.enabled ? 'checked' : ''} aria-label="Include ${esc(item.label)}" />
              <span></span>
            </label>
            <div class="item-name">
              <div class="nm" title="${esc(item.label)}">${esc(item.label)}</div>
              ${tier || note ? `<div class="meta">${tier}${note}</div>` : ''}
            </div>
            <button type="button" class="del" data-role="delete" aria-label="Remove ${esc(item.label)}">
              <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>
          <div class="item-bottom">
            <input type="range" class="slider" data-role="slider" min="0" max="${max}" step="50" value="${amount}" style="--p:${pct}%" aria-label="${esc(item.label)} amount" />
            <div class="amt"><span>₹</span><input type="number" data-role="num" min="0" step="50" value="${amount}" aria-label="${esc(item.label)} amount in rupees" /></div>
          </div>
        </div>`;
    }

    function renderList(type, opts = {}) {
      const list = type === 'in' ? state.incomes : state.expenses;
      const el = $(type === 'in' ? 'inList' : 'outList');
      el.innerHTML = list.map((it) => cardHTML(it, type, opts.stagger || it.id === opts.newId ? 'enter' : '')).join('');
      if (opts.stagger) el.querySelectorAll('.item').forEach((c, i) => { c.style.animationDelay = `${120 + i * 45}ms`; });
      if (opts.newId) {
        const card = el.querySelector(`[data-id="${CSS.escape(opts.newId)}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function bindList(type) {
      const el = $(type === 'in' ? 'inList' : 'outList');
      const getList = () => (type === 'in' ? state.incomes : state.expenses);
      const find = (target) => {
        const card = target.closest('.item');
        return card ? { card, item: getList().find((i) => i.id === card.dataset.id) } : {};
      };

      el.addEventListener('input', (e) => {
        const role = e.target.dataset.role;
        if (role !== 'slider' && role !== 'num') return;
        const { card, item } = find(e.target);
        if (!item) return;
        const val = Math.max(0, Number(e.target.value) || 0);
        item.amount = val;
        if (val > (item.max || 0)) item.max = Math.ceil((val * 1.25) / 1000) * 1000;
        const slider = card.querySelector('[data-role="slider"]');
        const num = card.querySelector('[data-role="num"]');
        if (role === 'num') { slider.max = item.max; slider.value = val; } else { num.value = val; }
        slider.style.setProperty('--p', `${Math.min(100, (val / slider.max) * 100)}%`);
        update(380);
      });

      el.addEventListener('change', (e) => {
        if (e.target.dataset.role !== 'toggle') return;
        const { card, item } = find(e.target);
        if (!item) return;
        item.enabled = e.target.checked;
        card.classList.toggle('off', !item.enabled);
        update(700);
      });

      el.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-role]');
        if (!btn) return;
        const { card, item } = find(btn);
        if (!item) return;
        if (btn.dataset.role === 'delete') {
          card.classList.add('leaving');
          setTimeout(() => {
            if (type === 'in') state.incomes = state.incomes.filter((i) => i !== item);
            else state.expenses = state.expenses.filter((i) => i !== item);
            card.remove();
            update(700);
            toast(`Removed ${item.label}`);
          }, 260);
        } else if (btn.dataset.role === 'tier') {
          item.tier = item.tier === 'optional' ? 'must' : 'optional';
          btn.className = `tier ${item.tier}`;
          btn.textContent = item.tier === 'optional' ? 'Optional' : 'Must';
          saveState();
        }
      });

      // Card hover highlights the matching flow in the Sankey
      el.addEventListener('mouseover', (e) => {
        const card = e.target.closest('.item');
        if (card && hoverId !== card.dataset.id) setHover(card.dataset.id, true);
      });
      el.addEventListener('mouseleave', () => setHover(null, true));
    }

    /* ---------- Sankey layout ---------- */
    function computeLayout(t, W, H) {
      const compact = W < 560;
      const nodeW = compact ? 10 : 14;
      const padTop = 52, padBottom = 18;
      const labelL = compact ? 86 : Math.min(150, W * 0.2);
      const labelR = compact ? 92 : Math.min(160, W * 0.21);
      const xL = labelL + 6;
      const xR = W - labelR - 6 - nodeW;
      const xC = (xL + xR) / 2;
      const usable = H - padTop - padBottom;
      const maxChars = compact ? 11 : W < 760 ? 15 : 20;

      const left = t.activeIncomes.map((i) => ({ id: i.id, label: i.label, value: +i.amount, color: i.color, kind: 'in' }));
      if (t.shortfall > 0) left.push({ id: '__shortfall', label: 'Shortfall', value: t.shortfall, color: SHORTFALL_COLOR, kind: 'shortfall' });
      const right = t.activeExpenses.map((e) => ({ id: e.id, label: e.label, value: +e.amount, color: e.color, kind: 'out' }));
      if (t.surplus > 0) right.push({ id: '__surplus', label: 'Surplus', value: t.surplus, color: SURPLUS_COLOR, kind: 'surplus' });

      const pool = Math.max(t.totalInflow, t.totalExpense);
      const nodes = new Map(), links = new Map();
      if (pool <= 0 || usable <= 40) return { nodes, links, empty: true, nodeW };

      const baseGap = compact ? 7 : 11;
      const gapFor = (n) => (n > 1 ? Math.min(baseGap, (usable * 0.35) / (n - 1)) : 0);
      const gL = gapFor(left.length), gR = gapFor(right.length);
      const k = Math.min((usable - gL * Math.max(0, left.length - 1)) / pool, (usable - gR * Math.max(0, right.length - 1)) / pool);

      const place = (items, x, gap, col) => {
        const total = items.reduce((s, d) => s + d.value * k, 0) + gap * Math.max(0, items.length - 1);
        let y = padTop + (usable - total) / 2;
        const placed = items.map((d) => {
          const h = Math.max(1.5, d.value * k);
          const n = { ...d, x, y, h, col, short: trunc(d.label, maxChars) };
          y += d.value * k + gap;
          return n;
        });
        // Spread labels so they never overlap
        const sp = compact ? 26 : 30;
        const ly = placed.map((n) => n.y + n.h / 2);
        for (let i = 1; i < ly.length; i++) ly[i] = Math.max(ly[i], ly[i - 1] + sp);
        const maxY = H - 16;
        if (ly.length) ly[ly.length - 1] = Math.min(ly[ly.length - 1], maxY);
        for (let i = ly.length - 2; i >= 0; i--) ly[i] = Math.min(ly[i], ly[i + 1] - sp);
        placed.forEach((n, i) => { n.ly = Math.max(14, ly[i]); nodes.set(n.id, n); });
        return placed;
      };

      const L = place(left, xL, gL, 'L');
      const R = place(right, xR, gR, 'R');
      const ph = pool * k;
      const P = { id: '__pool', label: 'Budget', value: pool, color: POOL_COLOR, kind: 'pool', x: xC - nodeW / 2, y: padTop + (usable - ph) / 2, h: ph, col: 'C', ly: 0, short: 'Budget' };
      nodes.set(P.id, P);

      let off = 0;
      L.forEach((n) => {
        const th = n.value * k;
        links.set('L:' + n.id, {
          id: 'L:' + n.id, src: n.id, tgt: P.id, x0: n.x + nodeW, x1: P.x, y0: n.y, y1: P.y + off, t: th,
          c0: n.color, c1: POOL_COLOR, value: n.value, label: n.label, kind: n.kind
        });
        off += th;
      });
      off = 0;
      R.forEach((n) => {
        const th = n.value * k;
        links.set('R:' + n.id, {
          id: 'R:' + n.id, src: P.id, tgt: n.id, x0: P.x + nodeW, x1: n.x, y0: P.y + off, y1: n.y, t: th,
          c0: POOL_COLOR, c1: n.color, value: n.value, label: n.label, kind: n.kind
        });
        off += th;
      });
      return { nodes, links, empty: false, nodeW, pool };
    }

    /* ---------- Sankey rendering with tweened transitions ---------- */
    const svg = $('sankey');
    const defs = svgEl('defs', {}, svg);
    const poolGrad = svgEl('linearGradient', { id: 'poolGrad', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    svgEl('stop', { offset: '0%', 'stop-color': '#818cf8' }, poolGrad);
    svgEl('stop', { offset: '100%', 'stop-color': '#a855f7' }, poolGrad);
    const gLinks = svgEl('g', {}, svg);
    const gFlows = svgEl('g', {}, svg);
    const gNodes = svgEl('g', {}, svg);

    const nodeEls = new Map();
    const linkEls = new Map();
    let shown = { nodes: new Map(), links: new Map() };
    let layoutMeta = { nodeW: 14, pool: 0 };
    let animRaf = null;
    let hoverId = null;

    function ribbon(l) {
      const xm = (l.x0 + l.x1) / 2;
      return `M${l.x0},${l.y0} C${xm},${l.y0} ${xm},${l.y1} ${l.x1},${l.y1} L${l.x1},${l.y1 + l.t} C${xm},${l.y1 + l.t} ${xm},${l.y0 + l.t} ${l.x0},${l.y0 + l.t} Z`;
    }
    function centerline(l) {
      const xm = (l.x0 + l.x1) / 2, a = l.y0 + l.t / 2, b = l.y1 + l.t / 2;
      return `M${l.x0},${a} C${xm},${a} ${xm},${b} ${l.x1},${b}`;
    }

    function getLinkEl(id) {
      let e = linkEls.get(id);
      if (e) return e;
      const gid = 'g' + Math.random().toString(36).slice(2, 9);
      const grad = svgEl('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse' }, defs);
      const s0 = svgEl('stop', { offset: '0%', 'stop-opacity': .55 }, grad);
      const s1 = svgEl('stop', { offset: '100%', 'stop-opacity': .55 }, grad);
      const path = svgEl('path', { class: 's-link', fill: `url(#${gid})` }, gLinks);
      const flow = svgEl('path', { class: 's-flow', fill: 'none', stroke: '#fff', 'stroke-linecap': 'round', 'stroke-dasharray': '0 24' }, gFlows);
      e = { grad, s0, s1, path, flow, data: null };
      path.addEventListener('mouseenter', (ev) => { setHover(id); showTip(ev, e.data); });
      path.addEventListener('mousemove', moveTip);
      path.addEventListener('mouseleave', () => { setHover(null); hideTip(); });
      linkEls.set(id, e);
      applyHover();
      return e;
    }

    function getNodeEl(id) {
      let e = nodeEls.get(id);
      if (e) return e;
      const g = svgEl('g', { class: 's-node' }, gNodes);
      const rect = svgEl('rect', { rx: 4 }, g);
      const label = svgEl('text', {}, g);
      const value = svgEl('text', {}, g);
      e = { g, rect, label, value, data: null };
      g.addEventListener('mouseenter', (ev) => { setHover(id); showTip(ev, e.data, true); });
      g.addEventListener('mousemove', moveTip);
      g.addEventListener('mouseleave', () => { setHover(null); hideTip(); });
      nodeEls.set(id, e);
      applyHover();
      return e;
    }

    function drawFrame(cur) {
      const nodeW = layoutMeta.nodeW;
      for (const [id, l] of cur.links) {
        const e = getLinkEl(id);
        e.data = l;
        e.path.setAttribute('d', ribbon(l));
        e.path.style.opacity = l.o;
        e.grad.setAttribute('x1', l.x0); e.grad.setAttribute('x2', l.x1);
        e.grad.setAttribute('y1', 0); e.grad.setAttribute('y2', 0);
        e.s0.setAttribute('stop-color', l.c0); e.s1.setAttribute('stop-color', l.c1);
        e.flow.setAttribute('d', centerline(l));
        e.flow.setAttribute('stroke-width', Math.max(1.6, Math.min(4.5, l.t * 0.22)).toFixed(2));
        e.flow.style.opacity = l.t >= 6 ? 0.6 * l.o : 0;
      }
      for (const [id, e] of linkEls) {
        if (!cur.links.has(id)) { e.path.remove(); e.flow.remove(); e.grad.remove(); linkEls.delete(id); }
      }

      for (const [id, n] of cur.nodes) {
        const e = getNodeEl(id);
        e.data = n;
        e.g.style.opacity = n.o;
        e.rect.setAttribute('x', n.x); e.rect.setAttribute('y', n.y);
        e.rect.setAttribute('width', nodeW); e.rect.setAttribute('height', Math.max(0, n.h));
        e.rect.setAttribute('fill', n.kind === 'pool' ? 'url(#poolGrad)' : n.color);
        if (n.col === 'C') {
          const cx = n.x + nodeW / 2;
          e.label.setAttribute('class', 's-pool-label');
          e.label.setAttribute('x', cx); e.label.setAttribute('y', n.y - 26); e.label.setAttribute('text-anchor', 'middle');
          e.value.setAttribute('class', 's-pool-value');
          e.value.setAttribute('x', cx); e.value.setAttribute('y', n.y - 9); e.value.setAttribute('text-anchor', 'middle');
          e.value.removeAttribute('fill');
        } else {
          const isL = n.col === 'L';
          const x = isL ? n.x - 10 : n.x + nodeW + 10;
          const anchor = isL ? 'end' : 'start';
          e.label.setAttribute('class', 's-label');
          e.label.setAttribute('x', x); e.label.setAttribute('y', n.ly - 3); e.label.setAttribute('text-anchor', anchor);
          e.value.setAttribute('class', 's-value');
          e.value.setAttribute('x', x); e.value.setAttribute('y', n.ly + 12); e.value.setAttribute('text-anchor', anchor);
          e.value.setAttribute('fill', n.kind === 'shortfall' ? '#d97706' : n.kind === 'surplus' ? '#16a34a' : '#64748b');
        }
        e.label.textContent = n.short;
        e.value.textContent = fmt(n.value);
      }
      for (const [id, e] of nodeEls) {
        if (!cur.nodes.has(id)) { e.g.remove(); nodeEls.delete(id); }
      }
    }

    function tween(a, b, keys, p) {
      const o = { ...b };
      for (const k of keys) o[k] = lerp(a[k], b[k], p);
      return o;
    }
    const NODE_KEYS = ['x', 'y', 'h', 'ly', 'value', 'o'];
    const LINK_KEYS = ['x0', 'x1', 'y0', 'y1', 't', 'value', 'o'];

    function animateTo(target, dur) {
      cancelAnimationFrame(animRaf);
      const pairs = { nodes: [], links: [] };
      const ids = (a, b) => new Set([...a.keys(), ...b.keys()]);

      for (const id of ids(shown.nodes, target.nodes)) {
        const a = shown.nodes.get(id), b = target.nodes.get(id);
        const end = b ? { ...b, o: 1 } : { ...a, y: a.y + a.h / 2, h: 0, value: 0, o: 0, gone: true };
        const start = a || { ...b, y: b.y + b.h / 2, h: 0, value: 0, o: 0 };
        pairs.nodes.push([id, start, end]);
      }
      for (const id of ids(shown.links, target.links)) {
        const a = shown.links.get(id), b = target.links.get(id);
        const end = b ? { ...b, o: 1 } : { ...a, y0: a.y0 + a.t / 2, y1: a.y1 + a.t / 2, t: 0, value: 0, o: 0, gone: true };
        const start = a || { ...b, y0: b.y0 + b.t / 2, y1: b.y1 + b.t / 2, t: 0, value: 0, o: 0 };
        pairs.links.push([id, start, end]);
      }

      const t0 = performance.now();
      const frame = (now) => {
        const raw = dur <= 0 || REDUCED ? 1 : Math.min(1, (now - t0) / dur);
        const p = ease(raw);
        const cur = { nodes: new Map(), links: new Map() };
        for (const [id, s, e] of pairs.nodes) if (!(raw === 1 && e.gone)) cur.nodes.set(id, tween(s, e, NODE_KEYS, p));
        for (const [id, s, e] of pairs.links) if (!(raw === 1 && e.gone)) cur.links.set(id, tween(s, e, LINK_KEYS, p));
        shown = cur;
        drawFrame(cur);
        if (raw < 1) animRaf = requestAnimationFrame(frame);
      };
      animRaf = requestAnimationFrame(frame);
    }

    function renderSankey(totals, dur) {
      const box = $('sankeyWrap').getBoundingClientRect();
      const W = Math.max(320, Math.floor(box.width));
      const H = Math.max(300, Math.floor(box.height));
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const layout = computeLayout(totals, W, H);
      layoutMeta = { nodeW: layout.nodeW, pool: layout.pool || 0 };
      $('empty').classList.toggle('show', layout.empty);
      animateTo(layout, dur);
    }

    /* ---------- Hover linking ---------- */
    function setHover(id, fromCard = false) {
      hoverId = id;
      applyHover();
      document.querySelectorAll('.item.linked').forEach((c) => c.classList.remove('linked'));
      if (id && !fromCard) {
        const nodeId = id.startsWith('L:') || id.startsWith('R:') ? id.slice(2) : id;
        const card = document.querySelector(`.item[data-id="${CSS.escape(nodeId)}"]`);
        if (card) card.classList.add('linked');
      }
    }

    function applyHover() {
      if (!hoverId) {
        linkEls.forEach((e) => { e.path.classList.remove('s-dim'); e.flow.classList.remove('s-dim'); });
        nodeEls.forEach((e) => e.g.classList.remove('s-dim'));
        return;
      }
      const isLink = linkEls.has(hoverId);
      const liveLinks = new Set(), liveNodes = new Set();
      linkEls.forEach((e, id) => {
        const d = e.data;
        if (!d) return;
        const hit = isLink ? id === hoverId : (d.src === hoverId || d.tgt === hoverId);
        if (hit) { liveLinks.add(id); liveNodes.add(d.src); liveNodes.add(d.tgt); }
      });
      if (!isLink) liveNodes.add(hoverId);
      linkEls.forEach((e, id) => { const dim = !liveLinks.has(id); e.path.classList.toggle('s-dim', dim); e.flow.classList.toggle('s-dim', dim); });
      nodeEls.forEach((e, id) => e.g.classList.toggle('s-dim', !liveNodes.has(id)));
    }

    /* ---------- Tooltip ---------- */
    const tip = $('tip');
    function showTip(ev, d, isNode = false) {
      if (!d) return;
      const pool = layoutMeta.pool || 1;
      let title, meta, color;
      if (isNode) {
        title = d.label; color = d.kind === 'pool' ? POOL_COLOR : d.color;
        meta = d.kind === 'pool' ? 'Everything that flows through this month'
          : d.kind === 'shortfall' ? 'Money you still need to cover outflows'
          : d.kind === 'surplus' ? 'Left over after all outflows'
          : `${((d.value / pool) * 100).toFixed(1)}% of the budget`;
      } else {
        const inbound = d.id.startsWith('L:');
        title = inbound ? `${d.label} → Budget` : `Budget → ${d.label}`;
        color = inbound ? d.c0 : d.c1;
        meta = d.kind === 'shortfall' ? 'Uncovered gap' : `${((d.value / pool) * 100).toFixed(1)}% of the budget`;
      }
      tip.querySelector('.t i').style.background = color;
      tip.querySelector('.t span').textContent = title;
      tip.querySelector('.a').textContent = fmt(d.value);
      tip.querySelector('.a').style.color = color;
      tip.querySelector('.m').textContent = meta;
      tip.classList.add('show');
      moveTip(ev);
    }
    function moveTip(ev) {
      const r = tip.getBoundingClientRect();
      const x = Math.min(window.innerWidth - r.width - 10, ev.clientX + 16);
      const y = Math.min(window.innerHeight - r.height - 10, ev.clientY + 16);
      tip.style.left = `${Math.max(10, x)}px`;
      tip.style.top = `${Math.max(10, y)}px`;
    }
    function hideTip() { tip.classList.remove('show'); }

    /* ---------- Summary ---------- */
    function renderSummary(t) {
      countTo($('inTotal'), t.totalInflow);
      countTo($('outTotal'), t.totalExpense);
      countTo($('kIn'), t.totalInflow);
      countTo($('kOut'), t.totalExpense);

      const nIn = t.activeIncomes.length, nOut = t.activeExpenses.length;
      $('inCount').textContent = `${nIn} active source${nIn === 1 ? '' : 's'}`;
      $('outCount').textContent = `${nOut} active · ${fmt(t.pausedTotal)} paused`;
      $('kInSub').textContent = `${nIn} source${nIn === 1 ? '' : 's'}`;
      $('kOutSub').textContent = t.totalInflow > 0 ? `${Math.round((t.totalExpense / t.totalInflow) * 100)}% of inflow` : `${nOut} item${nOut === 1 ? '' : 's'}`;

      const big = Math.max(t.totalInflow, t.totalExpense, 1);
      $('kInBar').style.width = `${(t.totalInflow / big) * 100}%`;
      $('kOutBar').style.width = `${(t.totalExpense / big) * 100}%`;

      const card = $('kNetCard');
      const neg = t.net < 0;
      card.classList.toggle('neg', neg);
      card.classList.toggle('pos', !neg);
      $('kNetLabel').textContent = neg ? 'Shortfall' : 'Surplus';
      countTo($('kNet'), Math.abs(t.net));
      $('kNetSub').textContent = neg ? 'Outflows exceed inflows' : t.totalInflow > 0 ? `${Math.round((t.surplus / t.totalInflow) * 100)}% saved` : 'Nothing yet';
      $('kNetBar').style.width = `${(Math.abs(t.net) / big) * 100}%`;
    }

    function update(dur = 600) {
      saveState();
      const t = computeTotals();
      renderSummary(t);
      renderSankey(t, dur);
    }

    /* ---------- Wire up ---------- */
    function bindForms() {
      $('inForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const label = $('inLabel').value.trim();
        const amount = Math.max(0, Number($('inAmount').value) || 0);
        if (!label) return;
        const id = 'inc_' + Date.now();
        state.incomes.push({ id, label, amount, max: Math.max(25000, Math.ceil((amount * 1.5) / 1000) * 1000), enabled: true, color: nextColor(state.incomes, IN_COLORS) });
        e.target.reset();
        renderList('in', { newId: id });
        update(800);
        toast(`Added ${label}`);
      });

      $('outForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const label = $('outLabel').value.trim();
        const amount = Math.max(0, Number($('outAmount').value) || 0);
        const tier = $('outTier').value === 'optional' ? 'optional' : 'must';
        if (!label) return;
        const id = 'exp_' + Date.now();
        state.expenses.push({ id, label, amount, max: Math.max(25000, Math.ceil((amount * 1.5) / 1000) * 1000), enabled: true, tier, color: nextColor(state.expenses, OUT_COLORS) });
        $('outLabel').value = ''; $('outAmount').value = '';
        renderList('out', { newId: id });
        update(800);
        toast(`Added ${label}`);
      });

      $('optBtn').addEventListener('click', () => {
        const opt = state.expenses.filter((e) => e.tier === 'optional');
        if (!opt.length) { toast('No optional items yet'); return; }
        const anyOn = opt.some((e) => e.enabled);
        opt.forEach((e) => { e.enabled = !anyOn; });
        document.querySelectorAll('#outList .item').forEach((card) => {
          const it = state.expenses.find((x) => x.id === card.dataset.id);
          if (!it) return;
          card.classList.toggle('off', !it.enabled);
          card.querySelector('[data-role="toggle"]').checked = it.enabled;
        });
        update(800);
        toast(anyOn ? 'Optional items paused' : 'Optional items included');
      });

      $('resetBtn').addEventListener('click', () => {
        state = defaults();
        renderList('in', { stagger: true });
        renderList('out', { stagger: true });
        update(900);
        toast('Reset to default items');
      });

      $('copyBtn').addEventListener('click', () => {
        const t = computeTotals();
        const text = JSON.stringify({
          exportedAt: new Date().toISOString(),
          summary: { totalInflow: t.totalInflow, totalExpense: t.totalExpense, net: t.net, paused: t.pausedTotal },
          incomes: state.incomes, expenses: state.expenses
        }, null, 2);
        const done = () => toast('Copied scenario JSON');
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
        else fallbackCopy(text, done);
      });
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (_) { toast('Could not copy'); }
      ta.remove();
    }

    renderList('in', { stagger: true });
    renderList('out', { stagger: true });
    bindList('in');
    bindList('out');
    bindForms();
    // Let the panels settle, then grow the diagram in
    requestAnimationFrame(() => update(1100));

    let lastSize = '';
    new ResizeObserver(([entry]) => {
      const { width, height } = entry.contentRect;
      const key = `${Math.round(width)}x${Math.round(height)}`;
      if (key === lastSize) return;
      const first = !lastSize;
      lastSize = key;
      if (!first) renderSankey(computeTotals(), 0);
    }).observe($('sankeyWrap'));
  </script>
</body>
</html>
